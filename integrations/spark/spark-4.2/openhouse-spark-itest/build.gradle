// Spark 4.2 (Scala 2.13) on the fork's Iceberg 1.12 line reads OpenHouse tables over the Iceberg
// REST Catalog (IRC) routes of the tables service, with Iceberg's own SparkCatalog and RESTCatalog
// and no OpenHouse catalog or client class in the Spark JVM; with the OpenHouse SQL extensions
// (extensionsTest), the OpenHouse statements run the same way, and so does the Spark SQL smoke suite
// (smokeTest). Not in the -PicebergLinkedIn reference build (settings.gradle), which has no
// Iceberg 1.12; see docs/development/iceberg-fork.md.
//
// Two classpaths, two JVMs:
// - test: Spark 4.2, the fork's shaded iceberg-spark-runtime-4.2_2.13 and the OpenHouse SQL
//   extensions' uber jar (the extensions and the capabilities module): no OpenHouse catalog, no
//   OpenHouse Java client, no Spring.
// - service: the tables service as the Spark 3.5 tests embed it (tables-test-fixtures, in-memory
//   H2 stores), plus the existing OpenHouse Java client that seeds the tables through the native
//   API. The test starts it in its own JVM (IrcReadTestServiceProcess) and stops it.
// The service cannot share the Spark 4.2 JVM: Spark 4.2 needs jackson-databind 2.21 (its
// jackson-module-scala refuses anything else) while the service runs on Spring Boot 2.7's 2.13, and
// the service's unshaded Iceberg jars would sit next to the engine's shaded runtime.
plugins {
  id 'java'
}

def pin = new Properties()
rootProject.file('scripts/iceberg-fork/iceberg-fork.properties').withInputStream { pin.load(it) }
def spark42Version = pin.getProperty('spark42Version')
def icebergVersion = rootProject.ext.iceberg_1_5_version
def forkRepo = rootProject.ext.icebergForkRepo
if (!new File(forkRepo, ".published-${icebergVersion}-spark-4.2_2.13").exists()) {
  throw new GradleException(
      "The fork's iceberg-spark-runtime-4.2_2.13:${icebergVersion} is not published in "
          + "${forkRepo}. Run scripts/iceberg-fork/publish-local.sh first.")
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
  service {
    java.srcDirs = ['src/service/java']
  }
  // The Spark SQL smoke suite. Its statements and baseline outcomes are one list, shared with the
  // Spark 3.5 itest, which owns it (work item N7): that itest's src/shared/smoke/java holds only
  // SparkSqlSmokeScenarios, which needs only spark.sql and JUnit, and both itests compile the same
  // file. src/smoke holds what runs the list on Spark 4.2 over IRC. Its own source set, so that the
  // other tests' JVMs, which assert what is on their classpath, do not get these classes.
  smoke {
    java.srcDirs = [
        rootProject.file('integrations/spark/spark-3.5/openhouse-spark-itest/src/shared/smoke/java'),
        'src/smoke/java'
    ]
  }
}

configurations {
  // The smoke suite runs on the classpath of the other Spark 4.2 tests.
  smokeImplementation.extendsFrom testImplementation
  smokeRuntimeOnly.extendsFrom testRuntimeOnly
  // The Spark 4.2 JVM keeps the versions Spark and the shaded runtime declare: the root build's
  // forces (Jackson 2.13.4 for the services, ORC/Avro/Caffeine for the 1.5 line) do not apply.
  [testCompileClasspath, testRuntimeClasspath, smokeCompileClasspath, smokeRuntimeClasspath].each {
    it.resolutionStrategy.forcedModules = []
  }
  serviceImplementation {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
  }
}

dependencies {
  testImplementation "com.linkedin.iceberg:iceberg-spark-runtime-4.2_2.13:${icebergVersion}"
  testImplementation("org.apache.spark:spark-sql_2.13:${spark42Version}")
  // The OpenHouse SQL extensions for Spark 4.2 (N3-x1), as an engine would add them: the uber jar.
  testImplementation project(path: ':integrations:spark:spark-4.2:openhouse-spark-4.2-runtime_2.13', configuration: 'shadow')

  // The service JVM: what the Spark 3.5 tests embed, and the existing Java client.
  serviceImplementation project(':tables-test-fixtures:tables-test-fixtures-iceberg-1.5_2.12')
  // The authorization handler the service main overrides lives in services:tables, which the
  // fixtures depend on at runtime only (as the Spark 3.5 itest compiles against it).
  serviceCompileOnly project(path: ':tables-test-fixtures:tables-test-fixtures-iceberg-1.5_2.12', configuration: 'runtimeElements')
  serviceImplementation project(':services:common')
  serviceImplementation(project(path: ':integrations:java:iceberg-1.5:openhouse-java-iceberg-1.5-runtime', configuration: 'shadow'))
  serviceImplementation "com.linkedin.iceberg:iceberg-data:${icebergVersion}"
  serviceImplementation "com.linkedin.iceberg:iceberg-parquet:${icebergVersion}"
  serviceImplementation "com.linkedin.iceberg:iceberg-orc:${icebergVersion}"
  serviceImplementation("org.apache.hadoop:hadoop-client:2.10.0") {
    // As openhouse.hadoop-conventions.
    exclude group: 'junit', module: 'junit'
    exclude group: 'javax', module: 'servlet-api'
    exclude group: 'org.mortbay.jetty', module: 'servlet-api'
    exclude group: 'com.zaxxer', module: 'HikariCP-java7'
    exclude group: 'org.apache.commons', module: 'commons-lang3'
    exclude group: 'com.codahale.metrics', module: 'metrics-core'
    exclude group: 'com.squareup.okhttp', module: 'okhttp'
  }
  serviceImplementation 'org.slf4j:slf4j-simple:1.7.36'
  serviceCompileOnly 'org.springframework.boot:spring-boot-starter-tomcat:' + spring_web_version
}

def extraJvmArgs = [
    'java.io', 'java.lang.invoke', 'java.lang.reflect', 'java.lang', 'java.math', 'java.net',
    'java.nio', 'java.text', 'java.time', 'java.util.concurrent.atomic', 'java.util.concurrent',
    'java.util.regex', 'java.util', 'jdk.internal.ref', 'jdk.internal.reflect', 'sun.util.calendar',
    'sun.nio.ch', 'sun.nio.cs', 'sun.security.action'
].collect { "--add-opens=java.base/${it}=ALL-UNNAMED" } + ['--add-opens=java.sql/java.sql=ALL-UNNAMED']

// Test classes run in the order they are found, except that a class annotated @Order runs by its
// order: the checks that read what the whole suite sent the service (SparkIrcNoPlanRequestTest,
// SmokeNoPlanRequestTest) run last.
def classOrder = 'org.junit.jupiter.api.ClassOrderer$OrderAnnotation'

tasks.named('test') {
  dependsOn tasks.named('serviceClasses')
  maxHeapSize = '1536m'
  jvmArgs extraJvmArgs
  systemProperty 'junit.jupiter.testclass.order.default', classOrder
  def serviceClasspath = sourceSets.service.runtimeClasspath
  inputs.files(serviceClasspath).withPropertyName('serviceClasspath').withNormalizer(ClasspathNormalizer)
  doFirst {
    systemProperty 'irc42.service.classpath', serviceClasspath.asPath
    systemProperty 'irc42.java', "${System.getProperty('java.home')}/bin/java"
    systemProperty 'irc42.workdir', "${temporaryDir}"
  }
  // The outcome depends on a server outside Gradle's view: never skip the run as up to date.
  outputs.upToDateWhen { false }
  // The SQL-extensions tests need a session built with the extensions: their own JVM, below.
  filter {
    excludeTestsMatching 'com.linkedin.openhouse.spark42.extensions.*'
  }
}

// The OpenHouse statements from Spark 4.2 with the OpenHouse SQL extensions in the session, against
// their own service JVM (IrcExtensionsTestService). Spark fixes a session's extensions when it is
// built, so these tests cannot share the IRC read tests' JVM and session.
tasks.register('extensionsTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  dependsOn tasks.named('serviceClasses')
  mustRunAfter tasks.named('test')
  maxHeapSize = '1536m'
  jvmArgs extraJvmArgs
  def serviceClasspath = sourceSets.service.runtimeClasspath
  inputs.files(serviceClasspath).withPropertyName('serviceClasspath').withNormalizer(ClasspathNormalizer)
  doFirst {
    systemProperty 'irc42.service.classpath', serviceClasspath.asPath
    systemProperty 'irc42.java', "${System.getProperty('java.home')}/bin/java"
    systemProperty 'irc42.workdir', "${temporaryDir}"
  }
  outputs.upToDateWhen { false }
  filter {
    includeTestsMatching 'com.linkedin.openhouse.spark42.extensions.*'
  }
}

// The Spark SQL smoke suite and the write statements, from Spark 4.2 over IRC, against their own
// service JVM (IrcSmokeTestService: the service the Spark 3.5 smoke suite embeds). Their own test
// JVM: the session names its catalog `openhouse`, as the smoke statements do.
tasks.register('smokeTest', Test) {
  testClassesDirs = sourceSets.smoke.output.classesDirs
  classpath = sourceSets.smoke.runtimeClasspath
  dependsOn tasks.named('serviceClasses')
  mustRunAfter tasks.named('test'), tasks.named('extensionsTest')
  maxHeapSize = '1536m'
  jvmArgs extraJvmArgs
  systemProperty 'junit.jupiter.testclass.order.default', classOrder
  def serviceClasspath = sourceSets.service.runtimeClasspath
  inputs.files(serviceClasspath).withPropertyName('serviceClasspath').withNormalizer(ClasspathNormalizer)
  def outcomes = layout.buildDirectory.file('reports/smoke/spark-4.2-irc-outcomes.tsv')
  outputs.file(outcomes).withPropertyName('smokeOutcomes')
  doFirst {
    systemProperty 'irc42.service.classpath', serviceClasspath.asPath
    systemProperty 'irc42.java', "${System.getProperty('java.home')}/bin/java"
    systemProperty 'irc42.workdir', "${temporaryDir}"
    // One line per smoke statement: the statement, the baseline, what Spark 4.2 over IRC did.
    systemProperty 'smoke.outcomes.file', outcomes.get().asFile.path
  }
  outputs.upToDateWhen { false }
}

// The same two suites a second time with server-side scan planning (work item V11b): the system
// property makes every IRC catalog of the session ask for scan-planning-mode=server, so each read
// and each row-level write plans its scans through the service's plan route (ServerPlanning). Their
// own tasks, not a parameter of test and smokeTest: each run needs its own Spark session (catalog
// properties are read when a catalog is first loaded) and its own service, whose access log the
// last check of each suite reads (the no-plan-request checks assert the converse here), and the
// default runs must stay exactly what a default client does.
def serverPlanning = 'irc42.scan-planning-mode'

tasks.register('testServerPlanning', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  dependsOn tasks.named('serviceClasses')
  mustRunAfter tasks.named('test'), tasks.named('extensionsTest'), tasks.named('smokeTest')
  maxHeapSize = '1536m'
  jvmArgs extraJvmArgs
  systemProperty 'junit.jupiter.testclass.order.default', classOrder
  systemProperty serverPlanning, 'server'
  def serviceClasspath = sourceSets.service.runtimeClasspath
  inputs.files(serviceClasspath).withPropertyName('serviceClasspath').withNormalizer(ClasspathNormalizer)
  doFirst {
    systemProperty 'irc42.service.classpath', serviceClasspath.asPath
    systemProperty 'irc42.java', "${System.getProperty('java.home')}/bin/java"
    systemProperty 'irc42.workdir', "${temporaryDir}"
  }
  outputs.upToDateWhen { false }
  filter {
    excludeTestsMatching 'com.linkedin.openhouse.spark42.extensions.*'
  }
}

tasks.register('smokeTestServerPlanning', Test) {
  testClassesDirs = sourceSets.smoke.output.classesDirs
  classpath = sourceSets.smoke.runtimeClasspath
  dependsOn tasks.named('serviceClasses')
  mustRunAfter tasks.named('test'), tasks.named('extensionsTest'), tasks.named('smokeTest'),
      tasks.named('testServerPlanning')
  maxHeapSize = '1536m'
  jvmArgs extraJvmArgs
  systemProperty 'junit.jupiter.testclass.order.default', classOrder
  systemProperty serverPlanning, 'server'
  def serviceClasspath = sourceSets.service.runtimeClasspath
  inputs.files(serviceClasspath).withPropertyName('serviceClasspath').withNormalizer(ClasspathNormalizer)
  def outcomes = layout.buildDirectory.file('reports/smoke/spark-4.2-irc-server-planning-outcomes.tsv')
  outputs.file(outcomes).withPropertyName('smokeOutcomes')
  doFirst {
    systemProperty 'irc42.service.classpath', serviceClasspath.asPath
    systemProperty 'irc42.java', "${System.getProperty('java.home')}/bin/java"
    systemProperty 'irc42.workdir', "${temporaryDir}"
    systemProperty 'smoke.outcomes.file', outcomes.get().asFile.path
  }
  outputs.upToDateWhen { false }
}

// As for the other test classes of the build (spotbugsTest is off in the root build).
tasks.matching { it.name == 'spotbugsSmoke' }.configureEach { enabled = false }
tasks.named('check') {
  dependsOn tasks.named('extensionsTest'), tasks.named('smokeTest'),
      tasks.named('testServerPlanning'), tasks.named('smokeTestServerPlanning')
}
