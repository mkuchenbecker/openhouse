// OpenHouse features as named capabilities (decision D23): the names, one interface per feature the
// Spark SQL extensions call, and the small value types those interfaces take. Plain Java with no
// Spring, no generated client and no Spark or Scala dependency, so one jar serves every engine line
// (the Spark 3.5 / Scala 2.12 extensions now, a Spark 4.2 / Scala 2.13 port later). Iceberg's API is
// compileOnly: the interfaces name its TableIdentifier and Namespace, which every engine line already
// carries in its own Iceberg runtime. The Spark runtime packs it into its uber jar, and its thin jar
// names it as a runtime dependency, so it is published as the Spark runtime is (same group, version
// and repositories, through openhouse.maven-publish).
plugins {
  id 'java-library'
  id 'checkstyle'
  id 'openhouse.maven-publish'
}

// Same target as openhouse.java-minimal-conventions (Java 17, or 8 under -PicebergLinkedIn),
// without that convention's mapstruct and servlet-api dependencies.
def javaTarget = rootProject.hasProperty('icebergLinkedIn') ? JavaVersion.VERSION_1_8 : JavaVersion.VERSION_17
sourceCompatibility = javaTarget
targetCompatibility = javaTarget

// The REST capability client's transport (HTTP client and authentication) is the one part that
// differs between Iceberg lines: 1.5.2 has OAuth2Util only, 1.12 has AuthManager. A build uses one
// Iceberg line for every module (1.12 by default, 1.5.2 under -PicebergLinkedIn), so the module
// compiles the transport for that line.
sourceSets {
  main {
    java {
      srcDir rootProject.hasProperty('icebergLinkedIn') ? 'src/iceberg-1.5/java' : 'src/iceberg-1.12/java'
    }
  }
}

checkstyle {
  configFile = rootProject.file('gradle/checkstyle/checkstyle.xml')
  configDirectory = rootProject.file('gradle/checkstyle')
}

dependencies {
  compileOnly "com.linkedin.iceberg:iceberg-api:${rootProject.ext.iceberg_1_5_version}"
  // The REST capability client (package rest, C2-3) uses the HTTP client, authentication, resource
  // paths and JSON mapper of the engine's own Iceberg runtime, so it is compileOnly too. It never
  // names a Jackson or Apache HTTP type, which the shaded Iceberg runtimes relocate.
  compileOnly "com.linkedin.iceberg:iceberg-core:${rootProject.ext.iceberg_1_5_version}"
  testImplementation "com.linkedin.iceberg:iceberg-api:${rootProject.ext.iceberg_1_5_version}"
  // The REST capability client's tests call a stub server through Iceberg's own HTTP client.
  testImplementation "com.linkedin.iceberg:iceberg-core:${rootProject.ext.iceberg_1_5_version}"
}
