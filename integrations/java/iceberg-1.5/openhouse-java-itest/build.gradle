plugins {
  id 'openhouse.java-minimal-conventions'
  id 'openhouse.maven-publish'
}

ext {
  icebergVersion = rootProject.ext.iceberg_1_5_version
}

sourceSets {
  test {
    java {
      // Under -PicebergFork the iceberg-1.2 project is not in the build (settings.gradle).
      srcDirs += rootProject.hasProperty('icebergFork')
          ? [rootProject.file('integrations/java/iceberg-1.2/openhouse-java-itest/src/test/java')]
          : project(':integrations:java:iceberg-1.2:openhouse-java-itest').sourceSets.test.java.srcDirs
    }
  }
}

dependencies {
  testImplementation(project(path: ':integrations:java:iceberg-1.5:openhouse-java-iceberg-1.5-runtime', configuration: 'shadow'))

  testImplementation "com.squareup.okhttp3:okhttp:4.9.3"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.9.3"
  testImplementation "com.linkedin.iceberg:iceberg-bundled-guava:" + icebergVersion
}
