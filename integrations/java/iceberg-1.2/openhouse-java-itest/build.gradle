plugins {
  id 'openhouse.java-minimal-conventions'
  id 'openhouse.maven-publish'
}

ext {
  icebergVersion = rootProject.ext.iceberg_1_2_version
}

// The tests are shared with the iceberg-1.5 itest and live there (src/shared/test).
sourceSets {
  test {
    java {
      srcDirs += rootProject.file('integrations/java/iceberg-1.5/openhouse-java-itest/src/shared/test/java')
    }
  }
}

dependencies {
  testImplementation(project(path: ':integrations:java:iceberg-1.2:openhouse-java-runtime', configuration: 'shadow'))

  testImplementation "com.squareup.okhttp3:okhttp:" + ok_http3_version
  testImplementation "com.squareup.okhttp3:mockwebserver:" + ok_http3_version
  testImplementation "com.linkedin.iceberg:iceberg-bundled-guava:" + icebergVersion
}
