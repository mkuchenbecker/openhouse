plugins {
    id 'openhouse.java-conventions'
    id 'openhouse.hadoop-conventions'
    id 'openhouse.maven-publish'
}

// Built on the line of its consumers that stay, the Spark 3.5 apps (apps/spark-3.5): Spark 3.5, the
// Iceberg 1.5 variant's Iceberg and the Iceberg 1.5 fixtures, on both Iceberg lines.
ext {
    icebergVersion = rootProject.ext.iceberg_1_5_version
    sparkVersion = '3.5.2'
    springVersion = '2.7.8'
    hadoopVersion = '2.10.0'
    sparkVersionSuffix = "3.5"
    openhouseSparkRuntimeModule = ":integrations:spark:spark-3.5:openhouse-spark-3.5-runtime_2.12"
    tablesTestFixturesModule = ":tables-test-fixtures:tables-test-fixtures-iceberg-1.5_2.12"
}

if (!rootProject.hasProperty('icebergLinkedIn')) {
    // The 1.5 fixtures bring the thin iceberg-orc/iceberg-parquet jars the Iceberg 1.12 line adds
    // (openhouse.iceberg-conventions-1.5.2). Next to the shaded iceberg-spark-runtime they break ORC
    // reads (shaded TypeDescription cannot be cast to org.apache.orc.TypeDescription), so they are
    // kept off the test classpath here as in the Spark 3.5 apps and itest.
    configurations.testRuntimeClasspath {
        exclude group: 'com.linkedin.iceberg', module: 'iceberg-orc'
        exclude group: 'com.linkedin.iceberg', module: 'iceberg-parquet'
    }
}

dependencies {
    compileOnly project(openhouseSparkRuntimeModule)
    implementation('com.linkedin.iceberg:iceberg-bundled-guava:' + icebergVersion)
    implementation('com.linkedin.iceberg:iceberg-data:' + icebergVersion)
    implementation('com.linkedin.iceberg:iceberg-core:' + icebergVersion)
    implementation('com.linkedin.iceberg:iceberg-common:' + icebergVersion)
    implementation('org.testcontainers:testcontainers:1.19.8')
    implementation ('org.apache.spark:spark-core_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation ('org.apache.spark:spark-sql_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation 'org.apache.hadoop:hadoop-common:' + hadoopVersion
    implementation "com.linkedin.iceberg:iceberg-spark-runtime-${sparkVersionSuffix}_2.12:" + icebergVersion

    testImplementation (project(path: openhouseSparkRuntimeModule, configuration: 'shadow')) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }

    // Otherwise throws the error: Scala module 2.10.0 requires Jackson Databind version >= 2.10.0 and < 2.11.0
    testImplementation 'com.fasterxml.jackson.module:jackson-module-scala_2.12:2.13.1'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
    testImplementation(project(tablesTestFixturesModule))
    testRuntimeOnly("org.eclipse.jetty:jetty-server:11.0.2")
}

test {
    if (JavaVersion.current() >= JavaVersion.VERSION_1_9) {
        jvmArgs \
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
            '--add-exports=java.base/sun.util.calendar=ALL-UNNAMED'
    }
}