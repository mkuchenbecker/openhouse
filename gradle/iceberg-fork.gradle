// The default build: the Iceberg 1.5 variant (Spark 3.5, Scala 2.12) is built and tested against
// the Iceberg commit pinned in scripts/iceberg-fork/iceberg-fork.properties, published by
// scripts/iceberg-fork/publish-local.sh into <ICEBERG_FORK_HOME>/<version>, by default
// <Gradle user home>/iceberg-fork/<version>: outside build/, so `clean` keeps it, and shared by every
// worktree on the machine.
//
// build.gradle applies this file unless -PicebergLinkedIn selects the reference line (LinkedIn's
// Iceberg 1.5.2 releases); the other spots that differ by line (root forces, Java target,
// iceberg-parquet/orc runtime jars, Spark classpath excludes) check the same property. See
// docs/development/iceberg-fork.md.

def pin = new Properties()
file('scripts/iceberg-fork/iceberg-fork.properties').withInputStream { pin.load(it) }

def forkVersion = "${pin.getProperty('baseVersion')}-ohfork.${pin.getProperty('commit').take(12)}"
def forkGroup = pin.getProperty('group')
// Same rule as publish-local.sh: ICEBERG_FORK_HOME, else <Gradle user home>/iceberg-fork.
def forkHomeEnv = providers.environmentVariable('ICEBERG_FORK_HOME').orNull
def forkHome = forkHomeEnv ? file(forkHomeEnv) : new File(gradle.gradleUserHomeDir, 'iceberg-fork')
def forkRepo = new File(forkHome, forkVersion)

if (!file("${forkRepo}/.published-${forkVersion}").exists()) {
  throw new GradleException(
      "The build uses Iceberg ${forkGroup}:${forkVersion}, built from the pinned fork commit, and it "
          + "is not published in ${forkRepo}. Run scripts/iceberg-fork/publish-local.sh first (once "
          + "per pinned commit per machine; docs/development/iceberg-fork.md). -PicebergLinkedIn "
          + "builds LinkedIn's Iceberg 1.5.2 reference line instead, which needs no local publish.")
}
logger.lifecycle("Iceberg 1.12 line: ${forkGroup}:${forkVersion} from ${forkRepo}")

// Every iceberg_1_5_version consumer (conventions and module build files) picks this up.
ext.iceberg_1_5_version = forkVersion
// Modules that check a marker of their own (Spark 4.2 runtime, REST compatibility kit) look here.
ext.icebergForkRepo = forkRepo

// The AWS SDK the fork's iceberg-aws needs (openhouse.iceberg-aws-conventions).
ext.icebergForkAwsSdkVersion = pin.getProperty('awsSdkVersion')

// Replace the root build's ORC/Avro forces (see build.gradle) with what the fork's Iceberg needs.
ext.icebergForkForces = [
    "org.apache.avro:avro:${pin.getProperty('avroVersion')}",
    "org.apache.orc:orc-core:${pin.getProperty('orcVersion')}",
    "com.github.ben-manes.caffeine:caffeine:${pin.getProperty('caffeineVersion')}",
]

allprojects {
  repositories {
    // Only this group at exactly this version comes from the local repo, and only from there.
    exclusiveContent {
      forRepository {
        maven {
          name = 'icebergForkLocal'
          url = forkRepo
        }
      }
      filter {
        includeVersionByRegex(
            java.util.regex.Pattern.quote(forkGroup), '.*', java.util.regex.Pattern.quote(forkVersion))
      }
    }
  }
}

// Nothing of this build may be published to a remote repository. Its Iceberg is built from a pinned
// source commit into a directory on this machine and hosted nowhere (decision D7; hosting it is
// work item I6d), so every published POM would name com.linkedin.iceberg:*:<fork version>, which no
// consumer can resolve. The check runs when the task graph is ready, before any task executes, for
// every way a publish can be started (`publish`, a single publish task, CI). Publishing to a file
// repository, `publishToMavenLocal` included, stays possible: it leaves the machine no more than
// the fork itself does.
gradle.taskGraph.whenReady { graph ->
  def remotePublishes = graph.allTasks.findAll {
    it instanceof PublishToMavenRepository && it.repository.url.scheme != 'file'
  }
  if (!remotePublishes.isEmpty()) {
    def targets = remotePublishes.collect { it.repository.url.toString() }.unique().join(', ')
    throw new GradleException(
        "Refusing to publish to ${targets}: this build's Iceberg is ${forkGroup}:*:${forkVersion}, "
            + "built from a pinned fork commit and hosted in no repository, "
            + "so the published POMs would name artifacts nobody can resolve. Either publish from "
            + "the reference line (-PicebergLinkedIn, LinkedIn's Iceberg 1.5.2 releases), or publish "
            + "the fork's Iceberg artifacts first and point the build at them, which is a decision "
            + "for the repository owner. First of ${remotePublishes.size()} such tasks: "
            + "${remotePublishes.first().path}.")
  }
}
