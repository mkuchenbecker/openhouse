\* Same unguarded-rename configuration, checking MonotonicVersion instead:
\* the unconditional rename UPDATE rewrites the row without bumping @Version,
\* so the version invariant is also violated (this is why concurrent writers'
\* optimistic locking cannot observe a rename).
CONSTANTS
  Writers = {w1, w2}
  MaxCommits = 4
  DivergenceCheck = TRUE
  SharedDedupCache = FALSE
  RenameGuard = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK MonotonicVersion
