\* Same tokenless configuration, checking MonotonicVersion instead: unlike the
\* unguarded rename, the tokenless rename DOES bump @Version and does write a
\* fresh metadata location, so the version invariant holds. That is the point
\* of this run -- a tokenless rename that drops a committed snapshot is
\* indistinguishable, by the version column alone, from a legitimate commit.
\* Expected: no error.
CONSTANTS
  Writers = {w1, w2}
  MaxCommits = 4
  DivergenceCheck = TRUE
  SharedDedupCache = FALSE
  RenameGuard = TRUE
  RenameToken = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK MonotonicVersion
