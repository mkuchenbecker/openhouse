\* Mode 3, tokenless: the shipped guard for callers that declare no base --
\* an old client that omits expectedMetadataLocation, or the INITIAL_VERSION
\* fallback for legacy tables with no persisted tableLocation. The rename
\* UPDATE is still conditional on the @Version the HTS service itself just
\* read, but nothing compares the renamer's loaded state to the row.
\* Expected: NoSnapshotLoss is VIOLATED -- a commit landing between the
\* renamer's load and the HTS service's read is still silently overwritten,
\* in a narrower but non-empty window than the unguarded rename's.
CONSTANTS
  Writers = {w1, w2}
  MaxCommits = 4
  DivergenceCheck = TRUE
  SharedDedupCache = FALSE
  RenameGuard = TRUE
  RenameToken = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSnapshotLoss
