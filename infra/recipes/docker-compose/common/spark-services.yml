version: "3.3"
# One Spark image: Spark 3.5 on Java 17 with the build's Iceberg runtime
# (docs/development/iceberg-fork.md, "Docker images"). OH_SPARK_BUILDER is passed only when it is
# set where docker compose runs; the dockerfile explains its two values.
services:
  spark-master:
    build:
      context: ../../../../
      dockerfile: infra/recipes/docker-compose/common/spark/spark-3.5-base-hadoop3.2.dockerfile
      args:
        - OH_SPARK_BUILDER
    ports:
      - 9001:8080
      - 7077:7077
    volumes:
      - ./spark/apps:/opt/spark-apps
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master
    env_file:
      - hadoop/hadoop.env
  spark-worker-a:
    build:
      context: ../../../../
      dockerfile: infra/recipes/docker-compose/common/spark/spark-3.5-base-hadoop3.2.dockerfile
      args:
        - OH_SPARK_BUILDER
    ports:
      - 9002:8080
      - 7000:7000
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-a
    env_file:
      - hadoop/hadoop.env
  spark-livy:
    build:
      context: ../../../../
      dockerfile: infra/recipes/docker-compose/common/spark/spark-3.5-base-hadoop3.2.dockerfile
      args:
        - OH_SPARK_BUILDER
    ports:
      - 9003:8998
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKLOAD=livy
      - LIVY_PORT=8998
    env_file:
      - hadoop/hadoop.env
