version: "3.3"
# The Spark image is the Spark 3.1 one unless OH_SPARK_DOCKERFILE names another, and a build
# argument is passed only when it is set where docker compose runs. ../iceberg-fork.env sets all
# of them for a -PicebergFork build.
services:
  spark-master:
    build:
      context: ../../../../
      dockerfile: ${OH_SPARK_DOCKERFILE:-infra/recipes/docker-compose/common/spark/spark-base-hadoop2.8.dockerfile}
      args:
        - OH_SPARK_APPS_NAME
        - OH_SPARK_BASE
        - OH_SPARK_BUILDER
    ports:
      - 9001:8080
      - 7077:7077
    volumes:
      - ./spark/apps:/opt/spark-apps
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master
    env_file:
      - hadoop/hadoop.env
  spark-worker-a:
    build:
      context: ../../../../
      dockerfile: ${OH_SPARK_DOCKERFILE:-infra/recipes/docker-compose/common/spark/spark-base-hadoop2.8.dockerfile}
      args:
        - OH_SPARK_APPS_NAME
        - OH_SPARK_BASE
        - OH_SPARK_BUILDER
    ports:
      - 9002:8080
      - 7000:7000
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-a
    env_file:
      - hadoop/hadoop.env
  spark-livy:
    build:
      context: ../../../../
      dockerfile: ${OH_SPARK_DOCKERFILE:-infra/recipes/docker-compose/common/spark/spark-base-hadoop2.8.dockerfile}
      args:
        - OH_SPARK_APPS_NAME
        - OH_SPARK_BASE
        - OH_SPARK_BUILDER
    ports:
      - 9003:8998
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKLOAD=livy
      - LIVY_PORT=8998
    env_file:
      - hadoop/hadoop.env
