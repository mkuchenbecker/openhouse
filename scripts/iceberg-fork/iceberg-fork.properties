# Iceberg build used by the opt-in -PicebergFork build (docs/development/iceberg-fork.md).
# The default build never reads this file.
#
# repoUrl/commit: the exact Iceberg source to build. publish-local.sh fetches this commit and
# publishes it under group:version below into ~/.gradle/iceberg-fork/<version> (never ~/.m2).
repoUrl=https://github.com/mkuchenbecker/iceberg.git
commit=a88f556c506744bb8e99617d58c9c7f1a9f81e58
# Published version is <baseVersion>-ohfork.<first 12 chars of commit>. It cannot collide with a
# com.linkedin.iceberg release, whose versions are four numeric parts (e.g. 1.5.2.24).
group=com.linkedin.iceberg
baseVersion=1.12.0
#
# Versions this Iceberg commit needs at runtime (its gradle/libs.versions.toml). They replace the
# root build's ORC/Avro forces and pin Caffeine, which internalcatalog otherwise compiles at 2.x.
avroVersion=1.12.2
orcVersion=1.9.9
caffeineVersion=3.2.4
# The AWS SDK this commit's iceberg-aws is compiled against (libs.versions.toml awssdk-bom). The
# fork's iceberg-aws takes the SDK compileOnly, so the S3 conventions supply it at this version.
awsSdkVersion=2.54.17
#
# Spark the fork's Spark 4.2 runtime is built against (its libs.versions.toml spark42). The
# Spark 4.2 IRC read test (integrations/spark/spark-4.2/openhouse-spark-itest) runs on this Spark.
spark42Version=4.2.0
