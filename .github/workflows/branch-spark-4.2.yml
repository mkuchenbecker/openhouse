name: Branch spark-4.2 CI

# spark4-upgrade: dedicated CI entrypoint for the `spark-4.2` integration branch. It fires only on
# pushes/merges to `spark-4.2` (a rare event), and reuses the shared build-run-tests workflow. Because
# the triggering event's github.ref is refs/heads/spark-4.2, the gated Iceberg-fork provisioning steps
# inside build-run-tests.yml run for this caller (and only this caller), so the OpenHouse build can
# resolve org.apache.iceberg:*:1.11.0-openhouse built for the Spark 4.2 / Scala 2.13 lane. Ordinary
# PRs (pr-validations.yml) and push-to-main (build-tag-publish.yml) reuse the same build-run-tests
# workflow but skip the fork build.
#
# The `spark-4.2` branch is a permanent custom branch (Iceberg 1.11 + Spark 4.2) that references the
# `1.11` branch and is never merged to main; the matching custom Iceberg fork source lives on
# mkuchenbecker/iceberg@spark-4.2.
on:
  push:
    branches:
      - 'spark-4.2'

concurrency:
  group: ci-spark-4.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-run-tests:
    uses: ./.github/workflows/build-run-tests.yml
