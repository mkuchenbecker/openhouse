name: Split Build and Run Tests

# One line's build, cut into jobs that run side by side (docs/development/iceberg-fork.md, "CI"),
# on a pull request (pr-validations.yml) and after each merge (post-merge-build.yml). The same
# Gradle tasks as the default line's single job before a release (build-run-tests.yml) and as the
# reference line's whole `clean build -PicebergLinkedIn`, cut by project: scripts/ci/test-groups.py
# lists a job per project directory that matches
# its patterns (the Spark apps, the Spark itests), each running that project's `check`, and the
# job `rest`, the whole build without those; the init script scripts/ci/test-groups.gradle does
# the cutting inside Gradle. So the jobs together run all of `build`, and a project or test task
# added later runs in its project's job or in `rest` without a change here. The default line's
# Docker steps are a job of their own. It publishes nothing outside the runner. It writes the
# Gradle cache only when the caller asks (after a merge), and then from one job of the line, `rest`;
# every other job takes the build's dynamic versions from the cache it restores
# (scripts/ci/dependency-cache.gradle) and lists the dependency files it still downloaded.
#
# The single job took 52 minutes on a pull request and up to 67 after a merge on 2026-11-24, most
# of it the apps' tests and the Spark itests sharing one runner; each group here has a runner to
# itself.
on:
  workflow_call:
    inputs:
      line:
        description: >-
          `default` (Iceberg 1.12 from the pinned fork commit) or `reference` (-PicebergLinkedIn,
          LinkedIn's Iceberg 1.5.2).
        type: string
        required: true
      gradle-cache-write:
        description: >-
          Let the line's `rest` job write the Gradle cache (after a merge to irc-integration); every
          other job, and every job when false (the default, a pull request), only reads it.
        type: boolean
        required: false
        default: false

jobs:
  # The jobs, from the patterns in scripts/ci/test-groups.py and the checkout's directories, so
  # that the jobs below and the exclusions of `rest` cannot disagree. And the merged migrations check of the default build:
  # every job of the line waits for it, as every step of the single job did.
  plan:
    name: ${{ inputs.line == 'default' && 'Default build' || 'Reference build' }}, test groups
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      # Protect merged migration files before deployment: only additions to the base's directory pass.
      - name: Check merged optimizer migrations are unchanged
        if: inputs.line == 'default' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code --stat --diff-filter=DMRT "$BASE_SHA" HEAD -- \
            libs/optimizer/optimizer-common/src/main/resources/db/migration

      - name: List the test groups
        id: groups
        run: |
          groups="$(python3 scripts/ci/test-groups.py matrix)"
          echo "Groups: $groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

      - name: Self-test the failed-tests printer
        run: python3 scripts/ci/test-print-failed-tests.py

  tests:
    name: ${{ inputs.line == 'default' && 'Default build' || 'Reference build' }}, ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # A red group does not cancel the others, as --continue does not stop at a red suite.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      # gradle/actions/setup-gradle keys the Gradle cache on the job id, and restores the newest
      # entry saved under it. Every job of a line uses one name, the id its single job had (so
      # the entries that job saved on irc-integration before still match): after a merge the
      # line's `rest` job saves under it, and every job, on a pull request and after a merge,
      # restores the newest entry.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: ${{ inputs.line == 'default' && 'build-and-run-tests' || 'iceberg-linkedin-build' }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      # One writer a line, not one a job: an entry is about 530 MB and setup-gradle's cleanup keeps
      # only what the job used, so a job's entry serves its own group. Eight entries a merge would
      # fill the repository's cache and evict the fork's entry and each other. `rest` is the
      # writer: it compiles every project and runs most test tasks, so its entry holds the
      # dependencies of every project's main code and the build-cache outputs of the most tasks.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ !(inputs.gradle-cache-write && matrix.group == 'rest') }}

      # A job that only reads the cache (the condition of cache-read-only above) resolves the build's
      # dynamic versions (ranges, `8.+`) as the cache's writer last did, instead of asking Maven
      # Central for their version lists again: the restored lookups are often older than Gradle's
      # 24 hours, and a refused request kills the job before any test runs
      # (scripts/ci/dependency-cache.gradle). From the Gradle user home's init.d it applies to every
      # Gradle command of the job. The writer keeps Gradle's default, so each merge refreshes them.
      # The marker dates the restore, for the count of downloads after the build.
      - name: Prepare the restored Gradle cache
        env:
          CACHE_READ_ONLY: ${{ !(inputs.gradle-cache-write && matrix.group == 'rest') }}
        run: |
          touch "$RUNNER_TEMP/gradle-cache-restored"
          if [ "$CACHE_READ_ONLY" = true ]; then
            mkdir -p "$GRADLE_USER_HOME/init.d"
            cp scripts/ci/dependency-cache.gradle "$GRADLE_USER_HOME/init.d/"
          fi

      # Every Gradle command of the default build needs it; the reference build needs none.
      - name: Restore or publish the Iceberg fork
        if: inputs.line == 'default'
        uses: ./.github/actions/iceberg-fork

      # The line's whole build, cut to this job's share by the init script (it prints what it
      # runs). With --continue, so that one red suite does not hide the others.
      - name: Run the group's Gradle tasks
        id: suites
        env:
          CI_GROUP_MODE: ${{ matrix.mode }}
          CI_GROUP_DIRS: ${{ matrix.dirs }}
          LINE_FLAG: ${{ inputs.line == 'reference' && '-PicebergLinkedIn' || '' }}
        # The console is also written to a file under RUNNER_TEMP (not build/, which `clean` empties):
        # a test JVM that dies leaves no JUnit XML, and the print step reads the failures from it.
        run: |
          set -o pipefail
          ./gradlew $LINE_FLAG -I scripts/ci/test-groups.gradle clean build --continue 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # What the job fetched beyond the restored cache, each a request Maven Central can refuse: a
      # downloaded file lands in files-2.1 with the time of download, a restored one keeps the time
      # it was saved with.
      - name: List the dependency files the job downloaded
        if: ${{ !cancelled() }}
        run: scripts/ci/list-downloaded-dependencies.sh "$RUNNER_TEMP/gradle-cache-restored"

      # When a suite above failed. Its failed tests' names and errors are thousands of lines up the
      # log, in what several test tasks wrote at once, and Gradle's closing summary names only the
      # task. These steps come last so that the job's log ends with each failed test and the start
      # of its failure (on the default line also the Spark 4.2 tests' own service processes' logs),
      # and the full reports can be downloaded. The kit's failing tests are expected and it reports
      # its own outcome, so its results are left out.
      - name: Print the failed tests
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' && inputs.line == 'default' }}
        run: >-
          python3 scripts/ci/print-failed-tests.py --exclude restCompatKitTest --lines 60
          --log "$RUNNER_TEMP/gradle-build.log"
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/service.log'
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs/*'
          build

      - name: Print the failed tests
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' && inputs.line == 'reference' }}
        run: python3 scripts/ci/print-failed-tests.py --lines 60 --log "$RUNNER_TEMP/gradle-build.log" build

      - name: Upload the test reports
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.line }}-build-test-reports-${{ matrix.group }}
          path: |
            build/*/reports/tests
            build/*/test-results
            build/openhouse-spark-4.2-itest/tmp/*/*/service.log
            build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs
          if-no-files-found: ignore
          retention-days: 7

  # The default build's Docker steps, as the single job before a release runs them after its
  # tests: the same composite action. They need the compiled build, not the tests' outcome.
  docker:
    name: Default build, Docker images and integration tests
    if: inputs.line == 'default'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build-and-run-tests
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # As in the test jobs: a reader takes the dynamic versions from the restored cache.
      - name: Prepare the restored Gradle cache
        run: |
          touch "$RUNNER_TEMP/gradle-cache-restored"
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp scripts/ci/dependency-cache.gradle "$GRADLE_USER_HOME/init.d/"

      - name: Restore or publish the Iceberg fork
        uses: ./.github/actions/iceberg-fork

      # What the images are built from. The test classes compile in the groups that run them.
      - name: Compile
        id: compile
        run: ./gradlew clean assemble

      - name: Build the deployables and run the integration tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: ./.github/actions/default-build-deployables

      - name: List the dependency files the job downloaded
        if: ${{ !cancelled() }}
        run: scripts/ci/list-downloaded-dependencies.sh "$RUNNER_TEMP/gradle-cache-restored"
