name: Pull Request Validations

on:
  pull_request:
    # edited: GitHub retargets a stacked PR when its base merges, without a new commit.
    types: [opened, synchronize, reopened, edited]

jobs:
  build-run-tests:
    # Of the edits, only a base-branch change reruns the build. The concurrency group is on the job,
    # so a skipped run doesn't cancel a running build.
    if: github.event.action != 'edited' || github.event.changes.base
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-run-tests.yml

  # The opt-in build against the pinned Iceberg fork (-PicebergFork), the same job that runs after
  # each merge to irc-integration: a change that breaks the build under the switch is red here,
  # before it merges. No `needs`: it runs beside the build above. Its own concurrency group, so the
  # two jobs never cancel each other; a newer push to the pull request cancels the older run.
  iceberg-fork-build:
    if: github.event.action != 'edited' || github.event.changes.base
    concurrency:
      group: ci-iceberg-fork-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/iceberg-fork-build.yml
