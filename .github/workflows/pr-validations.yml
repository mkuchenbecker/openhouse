name: Pull Request Validations

on:
  pull_request:
    # edited: GitHub retargets a stacked PR when its base merges, without a new commit.
    types: [opened, synchronize, reopened, edited]

jobs:
  # The default build: Iceberg 1.12 from the pinned fork commit, every suite, the deployables. The
  # same tasks and Docker steps as the single job before a release (build-run-tests.yml), cut into
  # parallel jobs (split-build.yml) so that a pull request waits for its slowest group, not for
  # all of them one after another. The run after each merge (post-merge-build.yml) is the same.
  # Its last job reports the single job's check, "build-run-tests / Build and Run Tests", green only
  # when every job of the build is: the check that branch protection requires.
  build-run-tests:
    # Of the edits, only a base-branch change reruns the build. The concurrency group is on the job,
    # so a skipped run doesn't cancel a running build.
    if: github.event.action != 'edited' || github.event.changes.base
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/split-build.yml
    with:
      line: default

  # The reference build on LinkedIn's Iceberg 1.5.2 (-PicebergLinkedIn), the whole
  # `clean build -PicebergLinkedIn` as after each merge to irc-integration (post-merge-build.yml),
  # cut into parallel jobs the same way: a change that breaks the line the default build is
  # measured against is red here, before it merges. Its last job reports
  # "iceberg-linkedin-build / Build and Run Tests"; branch protection need not require it, and
  # upstream it is optional. No `needs`: it runs beside the build above. Its own concurrency group,
  # so the two never cancel each other; a newer push to the pull request cancels the older run.
  iceberg-linkedin-build:
    if: github.event.action != 'edited' || github.event.changes.base
    concurrency:
      group: ci-iceberg-linkedin-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/split-build.yml
    with:
      line: reference
