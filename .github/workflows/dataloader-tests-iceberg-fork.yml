name: Dataloader Tests on the Iceberg Fork

# The Dataloader job (dataloader-tests.yml) on a -PicebergFork build (docs/development/iceberg-fork.md):
# the oh-hadoop-spark recipe with the Spark 3.5 / Java 17 image, whose build compiles Livy, and the
# dataloader's integration tests against it. It is the only place that image is built and run.
#
# By hand only, on any branch, until it has been green: no pull request and no merge runs it.
# The trigger that corresponds to the default build's Dataloader job is in the guide, ready to add
# (docs/development/iceberg-fork.md, "CI").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataloader-tests:
    uses: ./.github/workflows/dataloader-tests.yml
    with:
      iceberg-fork: true
