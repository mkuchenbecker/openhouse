name: Post-Merge Build and Test

# Runs the full default build (Iceberg 1.12 from the pinned fork commit) and its tests after each
# merge to the integration branch, and writes the Gradle cache and the published fork there so
# pull requests targeting this branch can restore them. A second, independent job runs the
# reference build on LinkedIn's Iceberg 1.5.2 (-PicebergLinkedIn). Neither publishes, tags,
# releases or deploys anything.
on:
  push:
    branches:
      - irc-integration
  workflow_dispatch:

# Read-only: the called jobs only check out sources and run Gradle, Docker Compose and Python.
permissions:
  contents: read

# Merges arrive faster than the build takes, so cancelling in-progress runs meant no run ever finished.
# A running build is allowed to finish; GitHub keeps at most one pending run in the group, and a newer
# pending run replaces an older pending one, so every merge is covered by some completed run.
concurrency:
  group: post-merge-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-run-tests:
    uses: ./.github/workflows/build-run-tests.yml
    with:
      gradle-cache-write: true

  # The reference build on LinkedIn's Iceberg 1.5.2 (-PicebergLinkedIn,
  # docs/development/iceberg-fork.md), defined once in iceberg-linkedin-build.yml and also run on
  # pull requests. A separate job with no `needs`, so it runs beside the build above on its own
  # runner and never holds it up. It publishes nothing.
  iceberg-linkedin-build:
    uses: ./.github/workflows/iceberg-linkedin-build.yml
