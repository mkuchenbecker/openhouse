name: Post-Merge Build and Test

# Runs both build lines whole after each merge to the integration branch: the default build
# (Iceberg 1.12 from the pinned fork commit) with its Docker steps, and the reference build on
# LinkedIn's Iceberg 1.5.2 (-PicebergLinkedIn). Each line is cut into parallel jobs exactly as on a
# pull request (split-build.yml, scripts/ci/test-groups.py): the jobs together run every task of
# `clean build`, and the default line's Docker job the deployables and the integration tests. Each
# line's `rest` job writes the Gradle cache that pull requests targeting this branch restore; the
# default line's jobs also save the published fork when they had to publish it. Nothing here
# publishes, tags, releases or deploys anything.
#
# Until 2026-11-24 each line was one job (build-run-tests.yml, iceberg-linkedin-build.yml): the
# default one took up to 67 minutes, and with a dozen merges a day each run queued behind the last,
# so a merge's answer came one to two hours later. Split, a run takes about what a pull request's
# build takes.
on:
  push:
    branches:
      - irc-integration
  workflow_dispatch:

# Read-only: the called jobs only check out sources and run Gradle, Docker Compose and Python.
permissions:
  contents: read

# One group per commit, so the runs of different merges overlap instead of queueing one behind
# another (and a newer merge never replaces an older merge's pending run): every merge gets its own
# run, which runs everything. A second run of the same commit (by hand) waits for the first;
# nothing is ever cancelled.
concurrency:
  group: post-merge-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-run-tests:
    uses: ./.github/workflows/split-build.yml
    with:
      line: default
      gradle-cache-write: true

  # The reference line. No `needs`: it runs beside the default line on its own runners and never
  # holds it up.
  iceberg-linkedin-build:
    uses: ./.github/workflows/split-build.yml
    with:
      line: reference
      gradle-cache-write: true
