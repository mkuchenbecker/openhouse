name: Dataloader Tests

# Two jobs. The dataloader's own checks and unit tests (`make sync verify`), and the integration
# tests: the oh-hadoop-spark recipe with the Spark image of the default build (Spark 3.5 on Java 17
# with Iceberg 1.12, Livy built from source), and the dataloader's tests against it
# (docs/development/iceberg-fork.md, "Docker images" and "CI").
#
# Both run on a pull request into main or irc-integration that touches the dataloader or what the
# recipe and its images are made from, after each merge to irc-integration (every change to the
# jars the Spark image carries reaches the image only there), and by hand on any branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - irc-integration
    paths:
      - 'integrations/python/dataloader/**'
      - 'infra/recipes/docker-compose/common/**'
      - 'infra/recipes/docker-compose/oh-hadoop-spark/**'
      - '*.Dockerfile'
      - 'scripts/iceberg-fork/**'
      - '.github/workflows/dataloader-tests.yml'
      - '.github/actions/iceberg-fork/**'
  push:
    branches:
      - irc-integration
  workflow_dispatch:

# A newer push to a pull request, or a newer run by hand on a branch, cancels the older run. A run
# after a merge is never cancelled, as in post-merge-build.yml: GitHub keeps one pending run in the
# group, and a newer pending run replaces an older pending one.
concurrency:
  group: dataloader-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Dataloader Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Data Loader Tests
        working-directory: integrations/python/dataloader
        run: make sync verify

  integration-test:
    name: Dataloader Integration Tests
    runs-on: ubuntu-latest
    # A run takes about 22 minutes when the fork has to be published first and about 6 less when
    # it comes from the cache. The limit is for a step that stalls.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The integration tests' image takes the dataloader's packages from this environment.
      - name: Sync the dataloader's dependencies
        working-directory: integrations/python/dataloader
        run: make sync

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore or publish the Iceberg fork
        uses: ./.github/actions/iceberg-fork

      # dockerPrereqs also stages the fork's iceberg-spark-runtime for the Spark image.
      - name: Build the uber JARs and the Docker prerequisites
        run: ./gradlew shadowJar dockerPrereqs

      # Its own step, with a limit: the Spark image builds Livy from source and takes Spark from
      # Docker Hub. A download that stalls fails the job here, with the build's log, in place of
      # running into the job's limit. BuildKit prints each line with the seconds since its stage's
      # step began.
      - name: Build the images
        timeout-minutes: 30
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml build

      - name: Start Docker Containers
        id: containers
        timeout-minutes: 15
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml up -d

      # Until everything the tests use answers: the tables and house tables services, the Livy
      # server, HDFS out of safe mode with its datanode, and the Spark master with its worker.
      - name: Wait for Docker Containers to be ready
        timeout-minutes: 12
        run: |
          compose="docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml"
          code() { curl -s -o /dev/null -m 5 -w '%{http_code}' "$1" || true; }
          i=0
          while [ "$SECONDS" -lt 600 ]; do
            i=$((i + 1))
            tables="$(code http://localhost:8000/actuator/health)"
            housetables="$(code http://localhost:8001/actuator/health)"
            livy="$(code http://localhost:9003/sessions)"
            datanodes="$($compose exec -T namenode hdfs dfsadmin -report 2>/dev/null | grep -c '^Live datanodes (1)' || true)"
            safemode="$($compose exec -T namenode hdfs dfsadmin -safemode get 2>/dev/null | grep -c '^Safe mode is OFF' || true)"
            workers="$(curl -s -m 5 http://localhost:9001/json/ | python3 -c 'import json, sys; print(json.load(sys.stdin)["aliveworkers"])' 2>/dev/null || true)"
            echo "Poll $i: tables=$tables housetables=$housetables livy=$livy live-datanodes=$datanodes safemode-off=$safemode spark-workers=$workers"
            if [ "$tables" = 200 ] && [ "$housetables" = 200 ] && [ "$livy" = 200 ] \
                && [ "$datanodes" = 1 ] && [ "$safemode" = 1 ] && [ "$workers" = 1 ]; then
              echo "Services ready after ${SECONDS}s"
              exit 0
            fi
            sleep 5
          done
          echo "The services were not ready within 600 s"
          exit 1

      # For the record of each run: the containers, and the Java, Spark, Hadoop client, Iceberg
      # runtime, Python and Livy the Spark image holds.
      - name: Print the containers and what the Spark image holds
        run: |
          compose="docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml"
          $compose ps -a
          $compose exec -T spark-livy sh -c '
            java -version 2>&1
            /opt/spark/bin/spark-submit --version 2>&1 | head -n 12
            echo "== /opt/spark"; ls -l /opt/spark; cat /opt/spark/RELEASE
            echo "== Hadoop client and Spark jars"; ls /opt/spark/jars | grep -i -E "^hadoop|^spark-(core|sql|repl)_"
            echo "== Iceberg and OpenHouse jars"; ls -l /opt/spark/jars/ | grep -i iceberg; ls -l /opt/spark/*.jar
            echo "== Python"; for p in python python3; do command -v $p && $p --version 2>&1; done; ls /opt/spark/python
            echo "== HADOOP_HOME=$HADOOP_HOME HADOOP_CONF_DIR=$HADOOP_CONF_DIR"; grep defaultFS "$HADOOP_CONF_DIR/core-site.xml"
            echo "== /opt/livy"; ls -l /opt/livy /opt/livy/bin; ls /opt/livy/*jars* | grep -i -E "jars:|livy"
            true'
          echo "== Livy server"
          curl -s -m 10 http://localhost:9003/version || true
          echo
          $compose logs --no-color spark-livy | grep -i -E "spark version|scala version|not verified|spark master|Starting server" | head -n 20 || true

      - name: Run Data Loader Integration Tests
        working-directory: integrations/python/dataloader
        run: make integration-tests TOKEN_FILE=../../../tables-test-fixtures/tables-test-fixtures-iceberg-1.5/src/shared/main/resources/dummy.token

      # Only when a step after the start failed, and it only prints. Last comes what a failed Spark
      # session leaves: Livy's sessions, the executors' output and the Livy server's log.
      - name: Print the containers' state and logs
        if: ${{ failure() && steps.containers.outcome == 'success' }}
        run: |
          compose="docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml"
          $compose ps -a || true
          print_log() {
            echo "::group::$1 (last $2 lines)"
            $compose logs --no-color --tail "$2" "$1" || true
            echo "::endgroup::"
          }
          print_log mysql 40
          print_log namenode 80
          print_log datanode 80
          print_log openhouse-housetables 150
          print_log openhouse-tables 300
          print_log spark-master 100
          print_log spark-worker-a 150
          echo "::group::Livy sessions, and each one's log as Livy kept it"
          curl -s http://localhost:9003/sessions | tee livy-sessions.json || true
          echo
          for id in $(python3 -c 'import json; print(*[s["id"] for s in json.load(open("livy-sessions.json"))["sessions"]])' || true); do
            echo "== session $id"
            curl -s "http://localhost:9003/sessions/$id/log?from=0&size=500" \
              | python3 -c 'import json, sys; print(*json.load(sys.stdin)["log"], sep="\n")' || true
          done
          echo "::endgroup::"
          echo "::group::Executors' output (last 200 lines of each file)"
          $compose exec -T spark-worker-a sh -c 'for f in /opt/spark/work/*/*/stderr; do echo "== $f"; tail -n 200 "$f"; done' || true
          echo "::endgroup::"
          print_log spark-livy 600

      - name: Stop Docker Containers
        if: always()
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml down
