name: Dataloader Tests

# Two jobs. The dataloader's own checks and unit tests (`make sync verify`) run on every pull
# request into main that touches the dataloader, as before. The integration tests (the
# oh-hadoop-spark recipe with the Spark image, and the dataloader's tests against it) run by hand
# only (workflow_dispatch): the Spark image of the default build, Spark 3.5 on Java 17 with Iceberg
# 1.12, has not finished building on a GitHub runner yet (its Livy build downloads a Spark release
# from archive.apache.org, which is rate-limited there), so on a pull request the job would only be
# red. The pull request trigger for it is in the guide, ready to add once a run by hand has been
# green (docs/development/iceberg-fork.md, "CI").
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'integrations/python/dataloader/**'
  workflow_dispatch:

concurrency:
  group: dataloader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Dataloader Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Data Loader Tests
        working-directory: integrations/python/dataloader
        run: make sync verify

  integration-test:
    name: Dataloader Integration Tests (by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The integration tests' image takes the dataloader's packages from this environment.
      - name: Sync the dataloader's dependencies
        working-directory: integrations/python/dataloader
        run: make sync

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore or publish the Iceberg fork
        uses: ./.github/actions/iceberg-fork

      # dockerPrereqs also stages the fork's iceberg-spark-runtime for the Spark image.
      - name: Build the uber JARs and the Docker prerequisites
        run: ./gradlew shadowJar dockerPrereqs

      # Its own step, with a limit: the Spark image builds Livy from source and takes Spark from
      # Docker Hub. A download that stalls fails the job here, with the build's log, in place of
      # running into the job's limit. BuildKit prints each line with the seconds since its stage's
      # step began.
      - name: Build the images
        timeout-minutes: 30
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml build

      - name: Start Docker Containers
        id: containers
        timeout-minutes: 15
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml up -d

      - name: Wait for Docker Containers to be ready
        run: |
          echo "Waiting for openhouse-tables and spark-livy..."
          for i in $(seq 1 120); do
            tables_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/databases 2>&1 || echo "000")
            livy_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9003/sessions 2>&1 || echo "000")
            echo "Poll $i: tables=$tables_status livy=$livy_status"
            if [ "$tables_status" != "000" ] && [ "$livy_status" != "000" ]; then
              echo "Services ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for services after 600s"
          docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml ps
          exit 1

      # For the record of each run: the Java, Spark, Hadoop client, Iceberg runtime, Python and Livy
      # the image holds.
      - name: Print what the Spark image holds
        run: |
          docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml exec -T spark-livy sh -c '
            java -version 2>&1
            /opt/spark/bin/spark-submit --version 2>&1 | head -n 12
            echo "== /opt/spark"; ls -l /opt/spark; cat /opt/spark/RELEASE
            echo "== /opt/spark/conf"; ls -l /opt/spark/conf
            echo "== Hadoop client jars"; ls /opt/spark/jars | grep -i -E "^hadoop|^spark-(core|sql|repl)_"
            echo "== Iceberg and OpenHouse jars"; ls -l /opt/spark/jars/ | grep -i iceberg; ls -l /opt/spark/*.jar
            echo "== Python"; for p in python python3; do command -v $p && $p --version 2>&1; done; ls /opt/spark/python
            echo "== HADOOP_HOME=$HADOOP_HOME HADOOP_CONF_DIR=$HADOOP_CONF_DIR"; grep -A1 defaultFS "$HADOOP_CONF_DIR/core-site.xml"
            echo "== /opt/livy"; ls -l /opt/livy /opt/livy/bin; ls /opt/livy/*jars* | grep -i -E "jars:|livy"
            echo "== Livy server"; curl -s http://localhost:8998/version; echo
            true'

      - name: Run Data Loader Integration Tests
        working-directory: integrations/python/dataloader
        run: make integration-tests TOKEN_FILE=../../../tables-test-fixtures/tables-test-fixtures-iceberg-1.5/src/shared/main/resources/dummy.token

      # Only when a step after the start failed, and it only prints. Last comes what a failed Spark
      # session leaves: Livy's sessions, the executors' output and the Livy server's log.
      - name: Print the containers' state and logs
        if: ${{ failure() && steps.containers.outcome == 'success' }}
        run: |
          compose="docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml"
          $compose ps -a || true
          print_log() {
            echo "::group::$1 (last $2 lines)"
            $compose logs --no-color --tail "$2" "$1" || true
            echo "::endgroup::"
          }
          print_log mysql 40
          print_log namenode 80
          print_log datanode 80
          print_log openhouse-housetables 150
          print_log openhouse-tables 300
          print_log spark-master 100
          print_log spark-worker-a 150
          echo "::group::Livy sessions, and each one's log as Livy kept it"
          curl -s http://localhost:9003/sessions | tee livy-sessions.json || true
          echo
          for id in $(python3 -c 'import json; print(*[s["id"] for s in json.load(open("livy-sessions.json"))["sessions"]])' || true); do
            echo "== session $id"
            curl -s "http://localhost:9003/sessions/$id/log?from=0&size=500" \
              | python3 -c 'import json, sys; print(*json.load(sys.stdin)["log"], sep="\n")' || true
          done
          echo "::endgroup::"
          echo "::group::Executors' output (last 200 lines of each file)"
          $compose exec -T spark-worker-a sh -c 'for f in /opt/spark/work/*/*/stderr; do echo "== $f"; tail -n 200 "$f"; done' || true
          echo "::endgroup::"
          print_log spark-livy 600

      - name: Stop Docker Containers
        if: always()
        run: docker compose -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml down
