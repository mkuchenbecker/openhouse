name: Opt-in Build against the Iceberg Fork

# The opt-in build against the pinned Iceberg fork (-PicebergFork, docs/development/iceberg-fork.md):
# publish the fork (or restore it from the cache), compile everything under the switch, run the
# opt-in suites and Apache Iceberg's REST compatibility kit. It publishes nothing outside the runner.
#
# One definition, called after each merge (post-merge-build.yml) and on each pull request
# (pr-validations.yml), so a pull request is tested under the switch by the same steps that test
# the branch it merges into. The callers set the concurrency: this file cancels nothing.
on:
  workflow_call:

jobs:
  # The job id is part of the Gradle cache's key (gradle/actions/setup-gradle): keep it, so that a
  # pull request restores the Gradle cache this job wrote on irc-integration.
  iceberg-fork-build:
    name: Opt-in build against the Iceberg fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Written only on irc-integration itself; read-only on a pull request and on a branch
          # run by hand.
          cache-read-only: ${{ github.ref != 'refs/heads/irc-integration' }}

      # Restores the published fork from the cache, or builds it and saves it. The action is shared
      # with the Dataloader job on this line (dataloader-tests.yml), so both use one cache entry.
      - name: Restore or publish the Iceberg fork
        uses: ./.github/actions/iceberg-fork

      - name: Compile everything under -PicebergFork
        id: compile
        run: ./gradlew -PicebergFork assemble testClasses

      # The suites docs/plans/irc/25-optin-green-result.md lists, plus the Spark 4.2 modules: the
      # SQL extensions' unit tests, the IRC read itest and its SQL-extensions tests (extensionsTest).
      # The Spark 3.5 itest `test` task depends on its catalogTest and statementTest tasks. The
      # capabilities module compiles its REST capability client's Iceberg 1.12 transport only here.
      - name: Run the opt-in suites under -PicebergFork
        id: suites
        run: >-
          ./gradlew -PicebergFork --continue
          :services:tables:test
          :iceberg:openhouse:internalcatalog:test
          :iceberg:openhouse:htscatalog:test
          :integrations:java:openhouse-catalog-capabilities:test
          :integrations:java:iceberg-1.5:openhouse-java-iceberg-1.5-itest:test
          :integrations:spark:spark-3.5:openhouse-spark-3.5-itest:test
          :integrations:spark:spark-4.2:openhouse-spark-4.2-runtime_2.13:test
          :integrations:spark:spark-4.2:openhouse-spark-4.2-itest:test
          :integrations:spark:spark-4.2:openhouse-spark-4.2-itest:extensionsTest

      # Apache Iceberg's REST compatibility kit against the service (V13). Its own step, run even when
      # a suite above failed, so a red kit never hides or blocks the other suites' results. It passes
      # when the kit tests that do not pass are exactly those listed, with their outcome, in
      # integrations/java/openhouse-rest-compat-kit/expected-outcomes.txt.
      - name: Run Apache Iceberg's REST compatibility kit under -PicebergFork
        if: ${{ !cancelled() }}
        run: ./gradlew -PicebergFork :integrations:java:openhouse-rest-compat-kit:restCompatKitTest

      # The deployables of this build (docs/development/iceberg-fork.md, "Docker images"): the jars
      # the images are built from, the jobs-scheduler image from the Spark 3.5 apps jar, and the
      # oh-only recipe with the integration tests the default build runs on its own containers
      # (build-run-tests.yml). After the suites and the kit, and whatever their outcome, so that
      # they report first and a red image never hides or blocks them; not after a failed compile,
      # which leaves nothing to build images from. The Spark image and the oh-hadoop-spark recipe
      # are the Dataloader job's (dataloader-tests-iceberg-fork.yml).
      - name: Build the uber jars and the Docker prerequisites under -PicebergFork
        id: docker-prereqs
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./gradlew -PicebergFork shadowJar dockerPrereqs

      # Built as the recipes build it, through docker compose with the env file. Then the image is
      # started without arguments: the scheduler logs its first line at INFO and stops on the
      # missing options, which shows the image's Java runs the jar's Java 17 classes and the jar
      # carries its log4j2 configuration (without it only errors are logged).
      - name: Build the jobs-scheduler image from the Spark 3.5 apps jar and start the scheduler in it
        if: ${{ !cancelled() && steps.docker-prereqs.outcome == 'success' }}
        env:
          COMPOSE: >-
            docker compose --env-file infra/recipes/docker-compose/iceberg-fork.env
            -f infra/recipes/docker-compose/oh-hadoop-spark/docker-compose.yml
            --profile with_jobs_scheduler
        run: |
          $COMPOSE build openhouse-jobs-scheduler
          image="$($COMPOSE config --images | grep -- '-openhouse-jobs-scheduler$')"
          echo "Image: $image"
          docker run --rm --entrypoint sh "$image" -c 'echo "APP_NAME=$APP_NAME"; ls -l "$APP_NAME.jar"; java -version' 2>&1 | tee scheduler-image.txt
          grep -qx 'APP_NAME=openhouse-spark-apps-1.5_2.12' scheduler-image.txt
          timeout 120 docker run --rm "$image" > scheduler-start.txt 2>&1 || true
          head -n 40 scheduler-start.txt
          grep -q 'INFO  JobsScheduler:[0-9]* - Starting scheduler' scheduler-start.txt

      - name: Start the oh-only recipe from the -PicebergFork jars
        id: oh-only
        if: ${{ !cancelled() && steps.docker-prereqs.outcome == 'success' }}
        run: >-
          docker compose --env-file infra/recipes/docker-compose/iceberg-fork.env
          -f infra/recipes/docker-compose/oh-only/docker-compose.yml up -d --build

      # Until both services answer HTTP (Spring opens the port when the application is ready).
      - name: Wait for the tables and house tables services
        id: oh-only-wait
        if: ${{ !cancelled() && steps.oh-only.outcome == 'success' }}
        run: |
          for i in $(seq 1 60); do
            tables="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/actuator/health || true)"
            housetables="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/actuator/health || true)"
            echo "Poll $i: tables=$tables housetables=$housetables"
            if [ "$tables" = 200 ] && [ "$housetables" = 200 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The services did not answer within 300 s"
          exit 1

      - name: Set up Python
        if: ${{ !cancelled() && steps.oh-only.outcome == 'success' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the integration tests against the oh-only containers
        id: oh-only-tests
        if: ${{ !cancelled() && steps.oh-only.outcome == 'success' }}
        run: |
          pip install -r scripts/python/requirements.txt
          python scripts/python/integration_test.py ./tables-test-fixtures/tables-test-fixtures-iceberg-1.5/src/shared/main/resources/dummy.token

      # The running tables service is the one built under the switch: its jar carries the fork's
      # iceberg-core (version <baseVersion>-ohfork.<commit>) and no other.
      - name: Check the Iceberg in the tables container
        id: oh-only-iceberg
        if: ${{ !cancelled() && steps.oh-only.outcome == 'success' }}
        run: |
          docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml \
            exec -T openhouse-tables sh -c 'java -version 2>&1; jar tf tables.jar' > tables-container.txt
          head -n 3 tables-container.txt
          grep 'iceberg-core-' tables-container.txt | tee tables-iceberg-core.txt
          test "$(wc -l < tables-iceberg-core.txt)" = 1
          grep -q 'iceberg-core-.*-ohfork\.' tables-iceberg-core.txt

      - name: Print the oh-only containers' state and logs
        if: >-
          ${{ !cancelled() && (steps.oh-only.outcome == 'failure' || steps.oh-only-wait.outcome == 'failure'
          || steps.oh-only-tests.outcome == 'failure' || steps.oh-only-iceberg.outcome == 'failure') }}
        run: |
          compose="docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml"
          $compose ps -a
          for service in prometheus opa oauth openhouse-housetables openhouse-tables; do
            echo "::group::$service (last 300 lines)"
            $compose logs --no-color --tail 300 "$service" || true
            echo "::endgroup::"
          done

      - name: Stop the oh-only containers
        if: ${{ always() && steps.oh-only.outcome != 'skipped' }}
        run: >-
          docker compose --env-file infra/recipes/docker-compose/iceberg-fork.env
          -f infra/recipes/docker-compose/oh-only/docker-compose.yml down

      # When a suite above failed. Its failed tests' names and errors are thousands of lines up the
      # log, above the kit's output, in what several test tasks wrote at once, and Gradle's closing
      # summary names only the task. These two steps come last so that the job's log ends with each
      # failed test and the start of its failure (and the Spark 4.2 tests' own service processes'
      # logs), and the full reports can be downloaded. The kit reports its own outcomes above.
      - name: Print the opt-in suites' failed tests
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        run: >-
          python3 scripts/ci/print-failed-tests.py --exclude restCompatKitTest --lines 60
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/service.log'
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs/*'
          build

      - name: Upload the opt-in suites' test reports
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-fork-test-reports
          path: |
            build/*/reports/tests
            build/*/test-results
            build/openhouse-spark-4.2-itest/tmp/*/*/service.log
            build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs
          if-no-files-found: ignore
          retention-days: 7
