name: Gradle Build and Run Tests

on:
  workflow_call: # Allow to be run by other workflows
    inputs:
      gradle-cache-write:
        description: >-
          Let this run write the Gradle cache. When false (the default), the cache is written only
          on the repository's default branch, as before.
        type: boolean
        required: false
        default: false

jobs:
  build-and-run-tests:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      # Protect merged migration files before deployment: only additions to the base's directory pass.
      - name: Check merged optimizer migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code --stat --diff-filter=DMRT "$BASE_SHA" HEAD -- \
            libs/optimizer/optimizer-common/src/main/resources/db/migration

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Same as the action's own default (read-only off the default branch) unless the caller opts in.
          cache-read-only: ${{ !inputs.gradle-cache-write && github.ref_name != github.event.repository.default_branch }}

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Start Docker Containers
        run: docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml up -d --build

      - name: Wait for Docker Containers to start
        run: sleep 30

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/python/requirements.txt

      - name: Run Integration Tests
        run: python scripts/python/integration_test.py ./tables-test-fixtures/tables-test-fixtures-iceberg-1.5/src/shared/main/resources/dummy.token

      - name: Stop Docker Containers
        run: docker compose -f infra/recipes/docker-compose/oh-only/docker-compose.yml down