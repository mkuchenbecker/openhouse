name: Gradle Build and Run Tests

# The default build: Iceberg 1.12 from the pinned fork commit (docs/development/iceberg-fork.md).
# Publishes the fork on the runner (or restores it from the cache), runs the whole
# `./gradlew clean build` (every suite, the Spark 4.2 modules and Apache Iceberg's REST
# compatibility kit among them), then builds the deployables and runs the integration tests
# against the oh-only containers. It publishes nothing outside the runner.
#
# One job, called after each merge (post-merge-build.yml) and before a release
# (build-tag-publish.yml). A pull request runs the same tasks and the same Docker steps cut into
# parallel jobs (split-build.yml, scripts/ci/test-groups.py). The reference build on LinkedIn's
# Iceberg 1.5.2 is iceberg-linkedin-build.yml.
on:
  workflow_call: # Allow to be run by other workflows
    inputs:
      gradle-cache-write:
        description: >-
          Let this run write the Gradle cache. When false (the default), the cache is written only
          on the repository's default branch, as before.
        type: boolean
        required: false
        default: false

jobs:
  # The job id is part of the Gradle cache's key (gradle/actions/setup-gradle): keep it, so that a
  # pull request restores the Gradle cache this job wrote on irc-integration.
  build-and-run-tests:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      # Protect merged migration files before deployment: only additions to the base's directory pass.
      - name: Check merged optimizer migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code --stat --diff-filter=DMRT "$BASE_SHA" HEAD -- \
            libs/optimizer/optimizer-common/src/main/resources/db/migration

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Same as the action's own default (read-only off the default branch) unless the caller opts in.
          cache-read-only: ${{ !inputs.gradle-cache-write && github.ref_name != github.event.repository.default_branch }}

      # Restores the published fork from the cache, or builds it and saves it. Every Gradle command
      # of the default build needs it. The action is shared with the Dataloader job
      # (dataloader-tests.yml), so both use one cache entry.
      - name: Restore or publish the Iceberg fork
        uses: ./.github/actions/iceberg-fork

      # Its own step, so that the Docker steps below can tell a failed compile, after which there
      # is nothing to build images from, from a failed test.
      - name: Compile everything
        id: compile
        run: ./gradlew clean assemble testClasses

      # Everything `./gradlew build` runs: every project's tests, the Spark 3.5 itest's catalogTest
      # and statementTest, the Spark 4.2 itest's extensionsTest and smokeTest, Apache Iceberg's REST
      # compatibility kit (restCompatKitTest, which passes when the kit tests that do not pass are
      # exactly those listed in integrations/java/openhouse-rest-compat-kit/expected-outcomes.txt),
      # checkstyle and spotbugs. With --continue, so that one red suite does not hide the others.
      - name: Build with Gradle
        id: suites
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./gradlew build --continue

      # The deployables (docs/development/iceberg-fork.md, "Docker images"): the jars the images are
      # built from, the jobs-scheduler image, and the oh-only recipe with the integration tests
      # (the composite action, shared with the pull request's Docker job in split-build.yml).
      # After the build and whatever its tests' outcome, so that they report first and a red image
      # never hides or blocks them; not after a failed compile, which leaves nothing to build
      # images from.
      - name: Build the deployables and run the integration tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: ./.github/actions/default-build-deployables

      # When a suite above failed. Its failed tests' names and errors are thousands of lines up the
      # log, in what several test tasks wrote at once, and Gradle's closing summary names only the
      # task. These two steps come last so that the job's log ends with each failed test and the
      # start of its failure (and the Spark 4.2 tests' own service processes' logs), and the full
      # reports can be downloaded. The kit's failing tests are expected and it reports its own
      # outcome, so its results are left out.
      - name: Print the failed tests
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        run: >-
          python3 scripts/ci/print-failed-tests.py --exclude restCompatKitTest --lines 60
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/service.log'
          --tail 'build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs/*'
          build

      - name: Upload the test reports
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: default-build-test-reports
          path: |
            build/*/reports/tests
            build/*/test-results
            build/openhouse-spark-4.2-itest/tmp/*/*/service.log
            build/openhouse-spark-4.2-itest/tmp/*/*/tomcat/logs
          if-no-files-found: ignore
          retention-days: 7
