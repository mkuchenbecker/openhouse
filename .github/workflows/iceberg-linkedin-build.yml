name: Reference Build on LinkedIn's Iceberg 1.5.2

# The reference build (-PicebergLinkedIn, docs/development/iceberg-fork.md): the Iceberg 1.5 variant
# against LinkedIn's com.linkedin.iceberg 1.5.2 releases, the behavior the default build's Iceberg
# 1.12 line is measured against (decision D8). The whole `clean build`: every suite that build has,
# so none can drop out of a list. It has no Spark 4.2 modules, no REST compatibility kit and no
# deployables, and needs no published fork. It publishes nothing outside the runner.
#
# One job, called after each merge (post-merge-build.yml). A pull request runs the same tasks cut
# into parallel jobs (split-build.yml, scripts/ci/test-groups.py). The callers set the concurrency:
# this file cancels nothing.
on:
  workflow_call:

jobs:
  # The job id is part of the Gradle cache's key (gradle/actions/setup-gradle): keep it, so that a
  # pull request restores the Gradle cache this job wrote on irc-integration.
  iceberg-linkedin-build:
    name: Reference build on LinkedIn's Iceberg 1.5.2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Written only on irc-integration itself; read-only on a pull request and on a branch
          # run by hand.
          cache-read-only: ${{ github.ref != 'refs/heads/irc-integration' }}

      # With --continue, so that one red suite does not hide the others.
      - name: Build with Gradle under -PicebergLinkedIn
        id: suites
        run: |
          set -o pipefail
          ./gradlew -PicebergLinkedIn clean build --continue 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # When a suite above failed. Its failed tests' names and errors are thousands of lines up the
      # log, in what several test tasks wrote at once, and Gradle's closing summary names only the
      # task. These two steps come last so that the job's log ends with each failed test and the
      # start of its failure, and the full reports can be downloaded.
      - name: Print the failed tests
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        run: python3 scripts/ci/print-failed-tests.py --lines 60 --log "$RUNNER_TEMP/gradle-build.log" build

      - name: Upload the test reports
        if: ${{ !cancelled() && steps.suites.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-build-test-reports
          path: |
            build/*/reports/tests
            build/*/test-results
          if-no-files-found: ignore
          retention-days: 7
