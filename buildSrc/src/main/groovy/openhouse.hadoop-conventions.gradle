ext {
  // spark4-upgrade rung 1: 2.10.0 -> 3.3.4. Iceberg 1.10 calls FileSystem.openFile(Path) (Hadoop
  // 3.3+ API); 2.10 lacks it (NoSuchMethodError at runtime). 3.3.4 matches Spark 3.5.2's bundled
  // Hadoop and is wire-compatible with the 3.1/3.2 RBF-fronted cluster.
  hadoopVersion = '3.3.4'
}

dependencies {
  api("org.apache.hadoop:hadoop-client:" + hadoopVersion) {
    exclude group: 'junit', module: 'junit'
    exclude group: 'javax', module: 'servlet-api'
    exclude group: 'com.zaxxer', module: 'HikariCP-java7'
    exclude group: 'org.apache.commons', module: 'commons-lang3'
    exclude group: 'com.codahale.metrics', module: 'metrics-core'
    exclude group: 'com.squareup.okhttp', module: 'okhttp'
  }
  api 'org.apache.commons:commons-lang3:3.12.0'
  // spark4-upgrade rung 1: Hadoop 2.10 transitively supplied the EOL commons-lang 2.x
  // (org.apache.commons.lang.*); Hadoop 3.3.4 dropped it. Several modules still import it
  // (StringUtils, math.NumberUtils, StringEscapeUtils). Restore it explicitly to keep this rung a
  // pure version bump — migrating those call sites to commons-lang3/commons-text is separate cleanup.
  api 'commons-lang:commons-lang:2.6'
}
