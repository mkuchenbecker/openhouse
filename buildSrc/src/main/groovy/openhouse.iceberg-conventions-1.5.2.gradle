// spark4-upgrade: server core bumped from com.linkedin.iceberg 1.5.2.15 -> stock
// org.apache.iceberg 1.11.0-openhouse. Group changed (fork artifacts are LinkedIn-published; the
// 1.11.0-openhouse artifacts come from the fork's publishToMavenLocal).
import org.gradle.api.attributes.java.TargetJvmVersion

ext {
  // spark4-upgrade: server core -> 1.11.0-openhouse (matures v3 deletion vectors). This feeds
  // services/tables (the embedded OpenHouse server) + iceberg/* + tables-test-fixtures, i.e. the
  // metadata-authoring path.
  icebergVersion = rootProject.ext.iceberg_1_11_version
}

// Iceberg 1.11 publishes Gradle Module Metadata declaring jvm.version=17, so Gradle's variant
// resolver refuses to place it on a targetCompatibility=8 module's classpath. That guard is
// metadata-conservative: -target 8 (v52) bytecode loads and runs fine on the Java 17 runtime this
// rung uses, next to the Java-17 Iceberg classes (bytecode target is a JVM floor, not an inter-jar
// contract). So we raise ONLY the *resolution* attribute of the consuming (resolvable) configs to
// 17, keeping the compile target at 8 — honoring the HDFS-client Java-8-bytecode requirement.
configurations.configureEach {
  if (canBeResolved && !canBeConsumed) {
    attributes {
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
  }
}

dependencies {
  api('org.apache.iceberg:iceberg-bundled-guava:' + icebergVersion)
  api('org.apache.iceberg:iceberg-data:' + icebergVersion)
  api('org.apache.iceberg:iceberg-core:' + icebergVersion)
  api('org.apache.iceberg:iceberg-common:' + icebergVersion)
  implementation('org.testcontainers:testcontainers:1.19.8')
}