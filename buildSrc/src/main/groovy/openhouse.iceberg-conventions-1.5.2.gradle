ext {
  icebergVersion = rootProject.ext.iceberg_1_5_version
}

dependencies {
  api('com.linkedin.iceberg:iceberg-bundled-guava:' + icebergVersion)
  api('com.linkedin.iceberg:iceberg-data:' + icebergVersion)
  api('com.linkedin.iceberg:iceberg-core:' + icebergVersion)
  api('com.linkedin.iceberg:iceberg-common:' + icebergVersion)
  if (rootProject.hasProperty('icebergFork')) {
    // -PicebergFork: newer iceberg-data registers its generic Avro, Parquet and ORC readers/writers
    // together, so without these jars (compileOnly in iceberg-data) even Avro is unregistered.
    runtimeOnly('com.linkedin.iceberg:iceberg-parquet:' + icebergVersion)
    runtimeOnly('com.linkedin.iceberg:iceberg-orc:' + icebergVersion)
  }
  implementation('org.testcontainers:testcontainers:1.19.8')
}