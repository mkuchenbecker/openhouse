plugins {
  id 'checkstyle'
  id 'java-library'
  id 'jacoco'
}

import org.gradle.api.attributes.java.TargetJvmVersion

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// spark4-upgrade: keep -target 8 bytecode (HDFS-client requirement) while consuming Apache Iceberg
// 1.11, whose Gradle Module Metadata declares jvm.version=17. Raise the TARGET_JVM_VERSION request
// ONLY on resolution-only configs (canBeResolved && !canBeConsumed) — the compile/runtime
// classpaths — so they accept the Java-17 library. Consumable configs (apiElements, runtimeElements,
// shadow) are left untouched, so this module still ADVERTISES Java 8 to its consumers (a Java-8 jar
// is compatible with a Java-17 consumer, so nothing downstream breaks). A 17 request still accepts
// jvm-8 and jvm-11 libs, so modules on the older lanes keep resolving.
configurations.configureEach {
  if (canBeResolved && !canBeConsumed) {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17) }
  }
}

ext {
  lombokVersion = '1.18.20'
  mapStructVersion = '1.5.5.Final'
}

checkstyle {
  configFile = rootProject.file('gradle/checkstyle/checkstyle.xml')
  configDirectory = rootProject.file('gradle/checkstyle')
}

dependencies {
  api 'org.mapstruct:mapstruct:' + mapStructVersion
  compileOnly 'org.projectlombok:lombok:' + lombokVersion
  annotationProcessor 'org.mapstruct:mapstruct-processor:' + mapStructVersion, 'org.projectlombok:lombok:' + lombokVersion
  testCompileOnly 'org.projectlombok:lombok:' + lombokVersion
  testAnnotationProcessor 'org.projectlombok:lombok:' + lombokVersion

  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

  testImplementation 'org.junit.jupiter:junit-jupiter:' + junit_version
  testImplementation "org.mockito:mockito-core:4.10.0"

  api "javax.servlet:javax.servlet-api:4.0.1"

}

tasks.named('test') {
  useJUnitPlatform()
}

jacocoTestReport {
  dependsOn test
  reports {
    html.required = true
  }
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: ['com/linkedin/openhouse/tables/client/**'])
    }))
  }
}
