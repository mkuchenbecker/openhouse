plugins {
  id 'checkstyle'
  id 'java-library'
  id 'jacoco'
}

// -PicebergFork (gradle/iceberg-fork.gradle): the fork's Iceberg artifacts are Java 17 bytecode and
// declare org.gradle.jvm.version=17, so every module targets 17 under the switch.
def javaTarget = rootProject.hasProperty('icebergFork') ? JavaVersion.VERSION_17 : JavaVersion.VERSION_1_8
sourceCompatibility = javaTarget
targetCompatibility = javaTarget

ext {
  lombokVersion = '1.18.20'
  mapStructVersion = '1.5.5.Final'
}

checkstyle {
  configFile = rootProject.file('gradle/checkstyle/checkstyle.xml')
  configDirectory = rootProject.file('gradle/checkstyle')
}

dependencies {
  api 'org.mapstruct:mapstruct:' + mapStructVersion
  compileOnly 'org.projectlombok:lombok:' + lombokVersion
  annotationProcessor 'org.mapstruct:mapstruct-processor:' + mapStructVersion, 'org.projectlombok:lombok:' + lombokVersion
  testCompileOnly 'org.projectlombok:lombok:' + lombokVersion
  testAnnotationProcessor 'org.projectlombok:lombok:' + lombokVersion

  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

  testImplementation 'org.junit.jupiter:junit-jupiter:' + junit_version
  testImplementation "org.mockito:mockito-core:4.10.0"

  api "javax.servlet:javax.servlet-api:4.0.1"

}

tasks.named('test') {
  useJUnitPlatform()
}

jacocoTestReport {
  dependsOn test
  reports {
    html.required = true
  }
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: ['com/linkedin/openhouse/tables/client/**'])
    }))
  }
}
