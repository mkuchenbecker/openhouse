pluginManagement {
  plugins {
  }
  resolutionStrategy {
  }
  repositories {
    maven {
      url "https://repo.maven.apache.org/maven2/"
      metadataSources {
        gradleMetadata()
        mavenPom()
        artifact()
      }
    }
    maven {
      url "https://plugins.gradle.org/m2/"
      metadataSources {
        mavenPom()
        artifact()
      }
    }
