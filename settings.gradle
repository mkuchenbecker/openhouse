pluginManagement {
  plugins {
  }
  resolutionStrategy {
  }
  repositories {
    maven {
      url "https://repo.maven.apache.org/maven2/"
      metadataSources {
        gradleMetadata()
        mavenPom()
        artifact()
      }
    }
    maven {
      url "https://plugins.gradle.org/m2/"
      metadataSources {
        mavenPom()
        artifact()
      }
    }
  }
}

// The default build is the Iceberg 1.12 line (docs/development/iceberg-fork.md): the Iceberg 1.5
// variant (Spark 3.5), the Spark 4.2 modules and the REST compatibility kit, against the fork's
// Iceberg 1.12 built from the commit pinned in scripts/iceberg-fork/iceberg-fork.properties.
//
// -PicebergLinkedIn builds the reference line instead: the Iceberg 1.5 variant against LinkedIn's
// com.linkedin.iceberg 1.5.2 releases, the behavior the 1.12 line is measured against (decision
// D8). The modules that need Iceberg 1.12 are not in that build.
def icebergLinkedIn = providers.gradleProperty('icebergLinkedIn').present
// -PicebergFork selected the 1.12 line while it was opt-in. It is accepted for one more cycle so
// that commands and branches written before the flip do not break, and does nothing.
if (providers.gradleProperty('icebergFork').present) {
  if (icebergLinkedIn) {
    throw new GradleException(
        '-PicebergFork and -PicebergLinkedIn contradict each other: the Iceberg 1.12 line is the '
            + 'default build, and -PicebergLinkedIn alone selects LinkedIn\'s Iceberg 1.5.2 line.')
  }
  logger.warn('WARNING: -PicebergFork is deprecated and does nothing: the Iceberg 1.12 line is now '
      + 'the default build. Remove the property; it will be rejected in a later release. '
      + '-PicebergLinkedIn selects LinkedIn\'s Iceberg 1.5.2 reference line.')
}
def icebergFork = !icebergLinkedIn

include ':apps:spark-3.5'

include ':client:common'
include ':client:hts'
include ':client:jobsclient'
include ':client:tableclient'
include ':client:optimizerclient'
include ':client:secureclient'

// OpenHouse features as capabilities (D23): plain Java, no Iceberg-line or Scala suffix, shared by
// every Spark extensions line.
include ':integrations:java:openhouse-catalog-capabilities'
include ':integrations:java:iceberg-1.5:openhouse-java-runtime'
include ':integrations:java:iceberg-1.5:openhouse-java-itest'
include ':integrations:spark:spark-3.5:openhouse-spark-runtime'
include ':integrations:spark:spark-3.5:openhouse-spark-itest'
// Spark 4.2 on the fork's Iceberg 1.12 runtime (N3): the OpenHouse SQL extensions ported to Spark 4.2
// / Scala 2.13 and the IRC itest. Both need Iceberg 1.12, so they are not in the reference build.
if (icebergFork) {
  include ':integrations:spark:spark-4.2:openhouse-spark-runtime'
  include ':integrations:spark:spark-4.2:openhouse-spark-itest'
  // Apache Iceberg's REST compatibility kit against the tables service's IRC routes (V13).
  include ':integrations:java:openhouse-rest-compat-kit'
}

include ':iceberg:openhouse:htscatalog'
include ':iceberg:openhouse:internalcatalog'
include ':iceberg:azure'

include ':libs:datalayout'
include ':libs:optimizer:binpack'

include ':services:common'
include ':services:housetables'
include ':services:jobs'
include ':services:optimizer'
include ':libs:optimizer:optimizer-common'
include ':libs:optimizer:analyzer'
include ':apps:optimizer:analyzerapp'
include ':libs:optimizer:scheduler'
include ':apps:optimizer:schedulerapp'
include ':services:tables'
include ':tables-test-fixtures:tables-test-fixtures-iceberg-1.5'

include ':cluster:configs'
include ':cluster:storage'
include ':cluster:metrics'

include ':scripts:java:tools:dummytokens'

include ':all-modules'

project(':apps:spark-3.5').name = 'openhouse-spark-apps-1.5_2.12'

project(':integrations:java:iceberg-1.5:openhouse-java-runtime').name = 'openhouse-java-iceberg-1.5-runtime'
project(':integrations:java:iceberg-1.5:openhouse-java-itest').name = 'openhouse-java-iceberg-1.5-itest'
project(':integrations:spark:spark-3.5:openhouse-spark-runtime').name = 'openhouse-spark-3.5-runtime_2.12'
project(':integrations:spark:spark-3.5:openhouse-spark-itest').name = 'openhouse-spark-3.5-itest'
if (icebergFork) {
  project(':integrations:spark:spark-4.2:openhouse-spark-runtime').name = 'openhouse-spark-4.2-runtime_2.13'
  project(':integrations:spark:spark-4.2:openhouse-spark-itest').name = 'openhouse-spark-4.2-itest'
}
project(':tables-test-fixtures:tables-test-fixtures-iceberg-1.5').name = 'tables-test-fixtures-iceberg-1.5_2.12'
