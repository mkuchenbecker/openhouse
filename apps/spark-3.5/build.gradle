plugins {
    // dependency in apps-spark-conventions
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'openhouse.apps-spark-common'
    id 'openhouse.iceberg-conventions-1.5.2'
}

ext {
    log4jVersion = "2.20.0"

    sparkVersion = '3.5.2'
    icebergVersion = rootProject.ext.iceberg_1_5_version
    sparkVersionSuffix = "3.5"
    openhouseSparkRuntimeModule = ":integrations:spark:spark-${sparkVersionSuffix}:openhouse-spark-3.5-runtime_2.12"
    icebergSparkRuntimeModule = "com.linkedin.iceberg:iceberg-spark-runtime-3.5_2.12:${icebergVersion}"
    tablesTestFixturesModule = ":tables-test-fixtures:tables-test-fixtures-iceberg-1.5_2.12"
}

configurations.all {
    exclude group: 'com.linkedin.iceberg', module: 'iceberg-data'
    if (!rootProject.hasProperty('icebergLinkedIn')) {
        // The Iceberg 1.12 line adds these thin jars (openhouse.iceberg-conventions-1.5.2); the
        // shaded iceberg-spark-runtime already carries them, as it does iceberg-data.
        exclude group: 'com.linkedin.iceberg', module: 'iceberg-orc'
        exclude group: 'com.linkedin.iceberg', module: 'iceberg-parquet'
    }
}
dependencies {
    compileOnly (project(path: openhouseSparkRuntimeModule)) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }

    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    implementation project(':libs:datalayout')
    // Exclude log4j-slf4j2-impl: incompatible with the log4j-slf4j-impl (1.x) bridge this app ships.
    implementation(project(':libs:optimizer:binpack')) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    }
    implementation ('org.apache.spark:spark-core_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation ('org.apache.spark:spark-sql_2.12:' + sparkVersion) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    implementation (icebergSparkRuntimeModule) {
        exclude group: 'io.netty'
    }

    testImplementation (project(path: openhouseSparkRuntimeModule, configuration: 'shadow')) {
        exclude group: 'io.netty'
        exclude group: 'org.apache.hadoop', module: 'hadoop-common'
        exclude group: 'org.apache.hadoop', module: 'hadoop-client'
    }
    testImplementation(project(tablesTestFixturesModule)) {
        exclude group: "io.netty"
    }
}

// src/shared holds the sources the Iceberg 1.2 / Spark 3.1 apps (apps/spark) compile as well: that
// project names these directories. src/main and src/test hold what only this project compiles.
sourceSets {
    main {
        java {
            srcDirs += 'src/shared/main/java'
        }
        // log4j2.properties: without it the scheduler (JobsScheduler, started from the uber jar in
        // the jobs-scheduler image) logs errors only. The Iceberg 1.2 / Spark 3.1 apps jar has always
        // carried it and this jar has not, so until that jar is gone it is packaged here only on
        // the Iceberg 1.12 line, where this is the apps jar the image runs.
        if (!rootProject.hasProperty('icebergLinkedIn')) {
            resources {
                srcDirs += 'src/shared/main/resources'
            }
        }
    }
    test {
        java {
            srcDirs += 'src/shared/test/java'
        }
    }
}
