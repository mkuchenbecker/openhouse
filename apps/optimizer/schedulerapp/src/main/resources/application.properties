spring.application.name=openhouse-optimizer-scheduler
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:h2:mem:schedulerdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${OPTIMIZER_DB_USER:sa}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
optimizer.scheduler.jobs.base-uri=${JOBS_BASE_URI:http://localhost:8002}
# Per-bin caps for ORPHAN_FILES_DELETION; 0 disables a dimension. File count is the OFD cost
# driver — per-file list, manifest joins, and delete calls dominate, independent of file size.
optimizer.scheduler.ofd.max-files-per-bin=${SCHEDULER_OFD_MAX_FILES_PER_BIN:1000000}
optimizer.scheduler.ofd.max-tables-per-bin=${SCHEDULER_OFD_MAX_TABLES_PER_BIN:50}
# Per-bin caps for STAGED_FILES_DELETION; 0 disables a dimension. As with OFD, file count is the
# cost driver — deleting abandoned staged/trash files is a per-file list + delete workload.
optimizer.scheduler.sfd.max-files-per-bin=${SCHEDULER_SFD_MAX_FILES_PER_BIN:1000000}
optimizer.scheduler.sfd.max-tables-per-bin=${SCHEDULER_SFD_MAX_TABLES_PER_BIN:50}
# Per-bin caps for SNAPSHOTS_EXPIRATION; 0 disables a dimension. File count is used as the cost
# proxy — snapshot expiration's metadata/manifest work tracks file count, mirroring OFD.
optimizer.scheduler.snapshotsExpiration.max-files-per-bin=${SCHEDULER_SNAPSHOTS_EXPIRATION_MAX_FILES_PER_BIN:1000000}
optimizer.scheduler.snapshotsExpiration.max-tables-per-bin=${SCHEDULER_SNAPSHOTS_EXPIRATION_MAX_TABLES_PER_BIN:50}
# Per-bin caps for RETENTION; 0 disables a dimension. A retention pass rewrites the affected
# partitions/files, so file count is again the dominant cost driver.
optimizer.scheduler.retention.max-files-per-bin=${SCHEDULER_RETENTION_MAX_FILES_PER_BIN:1000000}
optimizer.scheduler.retention.max-tables-per-bin=${SCHEDULER_RETENTION_MAX_TABLES_PER_BIN:50}
optimizer.scheduler.results-endpoint=${SCHEDULER_RESULTS_ENDPOINT:http://openhouse-optimizer:8080/v1/optimizer/operations}
optimizer.scheduler.cluster-id=${SCHEDULER_CLUSTER_ID:LocalHadoopCluster}
