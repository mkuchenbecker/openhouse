spring.application.name=openhouse-optimizer-analyzer
spring.main.web-application-type=none
spring.datasource.url=${OPTIMIZER_DB_URL:jdbc:h2:mem:analyzerdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${OPTIMIZER_DB_USER:sa}
spring.datasource.password=${OPTIMIZER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
ofd.success-retry-hours=16
ofd.failure-retry-hours=1
stagedFilesDeletion.success-retry-hours=16
stagedFilesDeletion.failure-retry-hours=1
snapshotsExpiration.success-retry-hours=16
snapshotsExpiration.failure-retry-hours=1
# Stats collection can refresh daily; success interval below 24h guarantees a re-evaluation within
# any rolling 24-hour window regardless of when the prior run landed.
tableStatsCollection.success-retry-hours=20
tableStatsCollection.failure-retry-hours=1
sortStatsCollection.success-retry-hours=20
sortStatsCollection.failure-retry-hours=1
