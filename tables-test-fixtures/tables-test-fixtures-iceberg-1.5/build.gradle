plugins {
  id 'com.github.johnrengelman.shadow' version '7.1.2'
  id 'openhouse.tables-test-fixtures-common'
  id 'openhouse.iceberg-conventions-1.5.2'
}

import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

ext {
  sparkVersion = '3.5.2'
}

// src/shared holds the sources, resources and tests the iceberg-1.2 fixtures compiled as well, until
// that project was deleted. It is an ordinary second source root now and can be folded into
// src/main and src/test.
sourceSets {
  main {
    java {
      srcDirs += 'src/shared/main/java'
    }
    resources {
      srcDirs += 'src/shared/main/resources'
    }
  }
  test {
    java {
      srcDirs += 'src/shared/test/java'
    }
  }
}

dependencies {
  compileOnly('org.apache.spark:spark-sql_2.12:' + sparkVersion){
    // These classes are available from `client-codegen-convention.gradle`
    exclude group: "io.netty"
  }
}

shadowJar {
  transform(PropertiesFileTransformer) {
    paths = ['META-INF/spring.factories']
    mergeStrategy = "merge"
  }
}

// For JacksonShadedVersionsTest: the line, and the Jackson modules of the runtime classpath, which
// the uber jar (shadowJar) is built from. An input of the task, so that a changed version reruns
// the test instead of reusing a result.
tasks.named('test') {
  systemProperty 'openhouse.iceberg.line', gradle.ext.icebergLinkedIn ? 'linkedin' : 'default'
  def runtime = configurations.runtimeClasspath
  def jacksonRuntime = providers.provider {
    runtime.incoming.resolutionResult.allComponents
        .collect { it.moduleVersion }
        .findAll { it != null && it.group.startsWith('com.fasterxml.jackson') }
        .collect { "${it.group}:${it.name}:${it.version}".toString() }
        .unique().sort().join(',')
  }
  inputs.property('jacksonRuntime', jacksonRuntime)
  doFirst {
    systemProperty 'openhouse.jackson.runtime', jacksonRuntime.get()
  }
}
