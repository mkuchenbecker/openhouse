# The House Tables stand-in's database for the tables service's e2e tests (SpringH2Application),
# the embedded H2 that Spring Boot would create, with one difference: OPTIMIZE_REUSE_RESULTS off.
# With it on, H2 2.1 can serve a session the row as it was before a commit that returned already,
# until the table changes again (HouseTablesH2ReadAfterCommitTest), which the house tables service
# never does. A name of its own per application context, as Spring Boot's generated one. The same
# setting as tables-test-fixtures-h2.properties in the shared fixture.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;OPTIMIZE_REUSE_RESULTS=FALSE
